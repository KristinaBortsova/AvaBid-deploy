services:
  backend:
    build: ../AvaBid/server
    env_file: ../AvaBid/server/.env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ../AvaBid
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
